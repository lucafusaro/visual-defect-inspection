[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-defect-inspection"
version = "0.1.0"
description = "Tools for detect visual defect"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "Pillow",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "torch",
    "torchvision",
    "scikit-learn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
